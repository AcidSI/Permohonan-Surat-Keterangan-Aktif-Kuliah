<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Permohonan Surat Aktif</title>
    <!-- Menghubungkan ke file CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Mengambil icon mata dari FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Selamat Datang</h2>
            <p>Sistem Permohonan Surat Keterangan Aktif Kuliah</p>
        </div>
        
        <!-- Form disiapkan agar mudah diproses backend nantinya -->
        <form id="loginForm" action="/login" method="POST">
            
            <div class="input-group">
                <label for="username">Username</label>
                <!-- name="username" sangat penting untuk backend -->
                <input type="text" id="username" name="username" placeholder="Masukkan NIM / Username" required>
            </div>
            
            <div class="input-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <!-- name="password" sangat penting untuk backend -->
                    <input type="password" id="password" name="password" placeholder="Masukkan Password" required>
                    <!-- Tombol Icon Mata -->
                    <span class="toggle-password" onclick="togglePassword()">
                        <i class="fa-solid fa-eye" id="eye-icon"></i>
                    </span>
                </div>
            </div>
            
            <div class="form-options">
                <a href="/lupa-password" class="forgot-password">Lupa Password?</a>
            </div>
            
            <button type="submit" class="submit-btn">Login</button>
            
        </form>
    </div>

    <!-- Script sederhana untuk fitur Lihat/Sembunyikan Password -->
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eye-icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash'); // Ganti jadi icon mata dicoret
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye'); // Ganti jadi icon mata biasa
            }
        }
    </script>

</body>
</html>
